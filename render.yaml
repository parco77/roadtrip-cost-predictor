# Render blueprint. On render.com: New -> Blueprint -> pick this repo. Render reads this file
# and creates the service; nothing below needs to be retyped into the dashboard except the one
# value marked sync:false, which cannot exist until the UI has been deployed once.
#
# Only backend/ is deployed. rootDir makes it the working directory, so `uvicorn app:app`
# resolves app.py, and app.py resolves data/ and models/ beside itself, exactly as it does
# when run locally. ml/ and frontend/ are never uploaded.
services:
  - type: web
    name: roadtrip-cost-api
    # Render's NATIVE Python runtime. `docker` is a separate value of this same field, so
    # naming python here is what rules Docker out - there is no Dockerfile in the repo to
    # fall back to either, which also stops the manual "New -> Web Service" flow from
    # auto-detecting one.
    runtime: python
    plan: free
    region: singapore          # closest region to Indian users and to the OSRM demo server
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit   # replaces the deprecated `autoDeploy: true`
    envVars:
      # Render's own default is now 3.14.3, which has no wheels for the pinned numpy,
      # pandas and scikit-learn - the build would compile from source or simply fail. This
      # must also be fully qualified: Render rejects a bare "3.13" in PYTHON_VERSION, though
      # backend/.python-version does accept one. Both are set, and this one wins.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: PYTHONUNBUFFERED
        value: "1"
      # The deployed UI's origin, e.g. https://roadtrip-cost-predictor.vercel.app
      # sync:false = set it in the dashboard once Vercel has issued the URL. Until then the
      # API falls back to "*", so the frontend works from the first deploy either way.
      - key: ALLOWED_ORIGINS
        sync: false
